name: PC host (.exe)

on:
  push:
    paths: ["host/**", ".github/workflows/host-windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Build exe
        run: |
          pip install pyinstaller
          pyinstaller --onefile --console --name ThumbRacerHost --paths . run_host.py
          copy config.toml dist\
          copy fake_phone.py dist\
      - uses: actions/upload-artifact@v4
        with:
          name: ThumbRacerHost-windows
          path: host/dist/
