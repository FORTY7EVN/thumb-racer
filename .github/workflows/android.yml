name: Android app (.apk)

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Unit tests
        run: gradle --no-daemon testReleaseUnitTest
      - name: Build APK
        run: |
          gradle --no-daemon assembleRelease
          mv app/build/outputs/apk/release/app-release.apk ThumbRacer.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ThumbRacer-android
          path: |
            android/ThumbRacer.apk
            android/app/build/reports/tests/
